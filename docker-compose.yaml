x-airflow-common: &airflow-common
  build:
    context: .
  image: portfolio-airflow-platform:2.10.0
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
    PYTHONPATH: /opt/airflow/dags:/opt/airflow/dags/weather
  volumes:
    - ${WEATHER_REPO_PATH:?Set WEATHER_REPO_PATH in .env}/dags:/opt/airflow/dags/weather:ro
    - ./logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    mem_limit: 512m

  airflow-init:
    <<: *airflow-common
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Airflow}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.invalid}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        if ! airflow users list --output json | python -c "import json, os, sys; users=json.load(sys.stdin); target=os.environ['AIRFLOW_ADMIN_USERNAME']; raise SystemExit(0 if any(user.get('username') == target for user in users) else 1)"; then
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname "$${AIRFLOW_ADMIN_FIRSTNAME}" \
            --lastname "$${AIRFLOW_ADMIN_LASTNAME}" \
            --role Admin \
            --email "$${AIRFLOW_ADMIN_EMAIL}"
        fi
        airflow pools set weather_pool 1 "Weather pipeline tasks"
        airflow pools set wta_pool 1 "WTA pipeline tasks"

  airflow-webserver:
    <<: *airflow-common
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1g

  airflow-scheduler:
    <<: *airflow-common
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1536m

volumes:
  airflow_metadata:
    name: portfolio_airflow_metadata
